<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#002b80" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0088ff" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#0033aa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Security Shield Contour -->
  <path d="M 256 36 L 436 96 C 436 260 366 390 256 476 C 146 390 76 260 76 96 Z"
        fill="url(#lensGrad)" stroke="url(#shieldGrad)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Shield Inner Border -->
  <path d="M 256 58 L 416 112 C 416 250 354 366 256 446 C 158 366 96 250 96 112 Z"
        fill="none" stroke="rgba(0, 168, 255, 0.25)" stroke-width="2" />

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="240" r="130" fill="#060a12" stroke="url(#shieldGrad)" stroke-width="6" />
  <circle cx="256" cy="240" r="118" fill="none" stroke="rgba(0, 229, 255, 0.4)" stroke-width="2" stroke-dasharray="6, 6" />

  <!-- Middle Lens Housing -->
  <circle cx="256" cy="240" r="96" fill="#0a101d" stroke="#0055cc" stroke-width="4" />

  <!-- Aperture Blades -->
  <g stroke="#00e5ff" stroke-width="2.5" opacity="0.85">
    <path d="M 256 160 L 290 220 L 230 210 Z" fill="#0d1b2a" />
    <path d="M 326 195 L 310 260 L 270 220 Z" fill="#0d1b2a" />
    <path d="M 326 285 L 265 295 L 285 245 Z" fill="#0d1b2a" />
    <path d="M 256 320 L 222 260 L 282 270 Z" fill="#0d1b2a" />
    <path d="M 186 285 L 202 220 L 242 260 Z" fill="#0d1b2a" />
    <path d="M 186 195 L 247 185 L 227 235 Z" fill="#0d1b2a" />
  </g>

  <!-- Central Camera Sensor Eye / Pupil -->
  <circle cx="256" cy="240" r="44" fill="#03070f" stroke="#00e5ff" stroke-width="3" />
  <circle cx="256" cy="240" r="32" fill="url(#apertureGlow)" />
  <circle cx="256" cy="240" r="14" fill="#00ffff" />

  <!-- Lens Glass Flare / Reflections -->
  <ellipse cx="236" cy="216" rx="28" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-35 236 216)" />
  <ellipse cx="276" cy="264" rx="14" ry="6" fill="#00e5ff" opacity="0.4" transform="rotate(-35 276 264)" />

  <!-- Corner Tech HUD Marks -->
  <path d="M 160 144 L 144 144 L 144 160" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 352 144 L 368 144 L 368 160" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 144 320 L 144 336 L 160 336" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 368 320 L 368 336 L 352 336" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />

  <!-- CCTV Pulse Status Indicator -->
  <circle cx="256" cy="80" r="6" fill="#00ff66">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
